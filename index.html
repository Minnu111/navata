<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Navata Vehicles Data Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg1:#0a0f1e;
  --bg2:#0f1729;
  --glass-bg:rgba(255,255,255,0.04);
  --glass-bg2:rgba(255,255,255,0.07);
  --glass-border:rgba(255,255,255,0.12);
  --glass-border2:rgba(255,255,255,0.18);
  --gold:#c9a84c;
  --gold2:#f0d080;
  --gold-light:rgba(201,168,76,0.15);
  --silver:#a8b8cc;
  --silver2:#d0dde8;
  --cream:#f5f0e8;
  --accent-blue:#4a9eff;
  --accent-teal:#2dd4bf;
  --accent-purple:#a78bfa;
  --text:#e8edf5;
  --muted:#7a8fa8;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --glow-gold: 0 0 30px rgba(201,168,76,0.25);
  --glow-blue: 0 0 30px rgba(74,158,255,0.2);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg1);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* Luxury background */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 10%, rgba(74,158,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 90%, rgba(201,168,76,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(167,139,250,0.04) 0%, transparent 70%),
    linear-gradient(160deg, #0a0f1e 0%, #0d1528 50%, #0a1020 100%);
  pointer-events:none;z-index:0;
}

/* Floating orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:float 12s ease-in-out infinite}
.orb1{width:500px;height:500px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(74,158,255,0.07),transparent 70%);animation-delay:0s}
.orb2{width:400px;height:400px;bottom:-80px;right:-80px;background:radial-gradient(circle,rgba(201,168,76,0.07),transparent 70%);animation-delay:-4s}
.orb3{width:300px;height:300px;top:40%;left:50%;background:radial-gradient(circle,rgba(167,139,250,0.05),transparent 70%);animation-delay:-8s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}

.wrapper{position:relative;z-index:1;padding:28px;max-width:1600px;margin:0 auto}

/* ═══════════════════ HEADER ═══════════════════ */
header{
  margin-bottom:36px;
  padding:28px 36px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border2);
  border-radius:24px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(201,168,76,0.04) 0%,transparent 50%,rgba(74,158,255,0.03) 100%);
  pointer-events:none;
}
header::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.5),rgba(255,255,255,0.3),rgba(74,158,255,0.4),transparent);
}
.brand{display:flex;align-items:center;gap:20px}
.brand-logo{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(74,158,255,0.15));
  border:1px solid rgba(201,168,76,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:var(--glow-gold),inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
}
.brand-text h1{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold2) 0%,var(--cream) 40%,var(--gold) 60%,var(--silver2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;
}
.brand-text p{
  font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;
  margin-top:3px;font-weight:400;
}
.header-stats{display:flex;gap:16px}
.hstat{
  text-align:center;padding:12px 20px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);
  border-radius:14px;
  backdrop-filter:blur(10px);
  position:relative;overflow:hidden;
  min-width:80px;
}
.hstat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent)}
.hstat-num{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700}
.hstat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}

/* ═══════════════════ KPI CARDS ═══════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.kpi-card{
  padding:24px 20px;border-radius:20px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative;overflow:hidden;
  transition:transform 0.3s,box-shadow 0.3s,border-color 0.3s;
  cursor:default;
}
.kpi-card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,0.22);
  box-shadow:var(--shadow),0 12px 40px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.12);
}
.kpi-card.active-filter{
  border-color:rgba(255,255,255,0.35) !important;
  box-shadow:var(--shadow),0 0 0 2px rgba(255,255,255,0.12),0 16px 48px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.18) !important;
  transform:translateY(-6px) scale(1.02);
  background:rgba(255,255,255,0.08) !important;
}
.kpi-card .click-hint{
  font-size:9px;color:rgba(255,255,255,0.25);
  text-transform:uppercase;letter-spacing:1px;
  margin-top:6px;transition:color 0.2s;
  display:flex;align-items:center;gap:4px;
}
.kpi-card:hover .click-hint{color:rgba(255,255,255,0.5)}
.kpi-card.active-filter .click-hint{color:rgba(255,255,255,0.65)}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--kpi-grad,linear-gradient(90deg,var(--gold),var(--gold2)));
}
.kpi-card::after{
  content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;
  background:var(--kpi-orb,rgba(201,168,76,0.08));
  border-radius:50%;filter:blur(20px);
}
.kpi-icon{font-size:26px;margin-bottom:12px;display:block}
.kpi-num{
  font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;
  background:var(--kpi-grad,linear-gradient(135deg,var(--gold),var(--gold2)));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.kpi-lbl{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:1px;font-weight:500}
.kpi-sub{font-size:10px;color:rgba(122,143,168,0.7);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06)}

/* ═══════════════════ GLASS CARDS ═══════════════════ */
.charts-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:20px;
  padding:24px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.05);
  position:relative;overflow:hidden;
}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.chart-card h3{
  font-family:'Cormorant Garamond',serif;
  font-size:17px;font-weight:600;
  background:linear-gradient(135deg,var(--gold2),var(--silver2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:18px;
  display:flex;align-items:center;gap:10px;
}
.chart-card h3::before{
  content:'';width:3px;height:18px;
  background:linear-gradient(180deg,var(--gold),transparent);
  border-radius:2px;display:inline-block;flex-shrink:0;
}
.chart-wrap{position:relative;height:220px}

/* Hub bars - liquid glass */
.hub-bars{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.hub-row{display:flex;align-items:center;gap:14px}
.hub-name{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--silver2);width:52px;flex-shrink:0;letter-spacing:0.5px;
}
.hub-bar-wrap{
  flex:1;background:rgba(255,255,255,0.04);
  border-radius:6px;height:26px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
  position:relative;
}
.hub-bar{
  height:100%;border-radius:5px;
  display:flex;align-items:center;padding-left:10px;
  font-size:11px;font-weight:700;color:rgba(0,0,0,0.8);
  transition:width 1.2s cubic-bezier(.4,0,.2,1);
  background:var(--hub-grad,linear-gradient(90deg,var(--gold),var(--gold2)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.2);
}
.hub-count{font-size:12px;color:var(--muted);width:30px;text-align:right;flex-shrink:0;font-family:'JetBrains Mono',monospace}

/* Maker grid */
.maker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.maker-item{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;
  transition:all 0.2s;
  backdrop-filter:blur(10px);
}
.maker-item:hover{background:rgba(255,255,255,0.06);border-color:rgba(201,168,76,0.3)}
.maker-name{font-size:13px;font-weight:500;color:var(--silver2)}
.maker-pct{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700}

/* ═══════════════════ TABLE SECTION ═══════════════════ */
.table-section{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:20px;overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,0.05);
}
.table-header{
  padding:20px 28px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:14px;
  background:rgba(255,255,255,0.02);
  position:relative;
}
.table-header::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),rgba(255,255,255,0.15),rgba(74,158,255,0.25),transparent)}
.table-title{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;font-weight:700;
  background:linear-gradient(135deg,var(--gold2),var(--silver2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px;display:flex;align-items:center;gap:12px;
}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:9px 16px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;width:270px;
  transition:all 0.2s;
  backdrop-filter:blur(10px);
}
.search-box:focus{border-color:rgba(201,168,76,0.5);box-shadow:0 0 0 3px rgba(201,168,76,0.08)}
.search-box::placeholder{color:var(--muted)}
select.filter-sel{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:9px 14px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;cursor:pointer;backdrop-filter:blur(10px);
  transition:border-color 0.2s;
}
select.filter-sel:focus{border-color:rgba(201,168,76,0.4)}
select.filter-sel option{background:#0f1729;color:var(--text)}
.count-badge{
  background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(240,208,128,0.1));
  border:1px solid rgba(201,168,76,0.3);
  border-radius:20px;padding:4px 16px;
  font-size:13px;font-family:'JetBrains Mono',monospace;
  color:var(--gold2);font-weight:600;
  box-shadow:0 0 12px rgba(201,168,76,0.1);
}

/* Table */
.table-wrap{overflow-x:auto;max-height:500px;overflow-y:auto}
.table-wrap::-webkit-scrollbar{width:5px;height:5px}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.2);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  background:rgba(255,255,255,0.03);
  color:var(--gold);font-family:'DM Sans',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  padding:13px 18px;text-align:left;position:sticky;top:0;z-index:2;
  cursor:pointer;user-select:none;border-bottom:1px solid rgba(255,255,255,0.06);
  white-space:nowrap;transition:color 0.2s;
  backdrop-filter:blur(20px);
}
thead th:hover{color:var(--gold2)}
thead th.sorted{color:var(--gold2)}
.sort-icon{display:inline-block;margin-left:4px;opacity:0.35;font-size:10px}
thead th.sorted .sort-icon{opacity:1}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s}
tbody tr:hover{background:rgba(255,255,255,0.03)}
tbody td{padding:12px 18px;color:var(--text);vertical-align:middle}
tbody td:first-child{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--gold2)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;backdrop-filter:blur(10px)}
.badge-TRUCKS{background:rgba(74,158,255,0.12);color:#7ab8ff;border:1px solid rgba(74,158,255,0.2)}
.badge-BIKES{background:rgba(45,212,191,0.12);color:#2dd4bf;border:1px solid rgba(45,212,191,0.2)}
.badge-CARS{background:rgba(201,168,76,0.12);color:var(--gold2);border:1px solid rgba(201,168,76,0.2)}
.badge-TRUST{background:rgba(167,139,250,0.12);color:#c4b5fd;border:1px solid rgba(167,139,250,0.2)}
.badge-MOBILES{background:rgba(244,114,182,0.12);color:#f9a8d4;border:1px solid rgba(244,114,182,0.2)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.age-pill{display:inline-block;padding:2px 10px;border-radius:6px;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}
.age-new{background:rgba(45,212,191,0.12);color:#2dd4bf;border:1px solid rgba(45,212,191,0.2)}
.age-mid{background:rgba(201,168,76,0.12);color:var(--gold2);border:1px solid rgba(201,168,76,0.2)}
.age-old{background:rgba(251,146,60,0.12);color:#fb923c;border:1px solid rgba(251,146,60,0.2)}
.age-vold{background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.2)}

/* Pagination */
.pagination{
  padding:16px 28px;border-top:1px solid rgba(255,255,255,0.05);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  background:rgba(255,255,255,0.01);
}
.page-info{font-size:12px;color:var(--muted);letter-spacing:0.5px}
.page-btns{display:flex;gap:6px}
.page-btn{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  color:var(--silver);border-radius:9px;
  padding:6px 14px;font-size:12px;cursor:pointer;
  transition:all 0.2s;font-family:'DM Sans',sans-serif;
  backdrop-filter:blur(10px);
}
.page-btn:hover{background:rgba(201,168,76,0.12);border-color:rgba(201,168,76,0.3);color:var(--gold2)}
.page-btn.active{background:linear-gradient(135deg,rgba(201,168,76,0.25),rgba(240,208,128,0.15));border-color:rgba(201,168,76,0.4);color:var(--gold2);font-weight:600}
.page-btn:disabled{opacity:0.25;cursor:not-allowed}

/* ═══════════════════ FOOTER ═══════════════════ */
footer{
  margin-top:32px;padding:18px 28px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:16px;
  backdrop-filter:blur(20px);
  text-align:center;
  position:relative;overflow:hidden;
}
footer::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),rgba(255,255,255,0.1),rgba(74,158,255,0.2),transparent)}
.footer-content{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.footer-divider{width:4px;height:4px;background:rgba(201,168,76,0.4);border-radius:50%}
.footer-copy{font-size:11px;color:var(--muted);letter-spacing:1px}
.footer-brand{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--gold),var(--gold2),var(--silver2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.footer-year{font-size:11px;color:rgba(122,143,168,0.6);letter-spacing:0.5px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.kpi-card{animation:fadeUp 0.6s ease both}
.kpi-card:nth-child(1){animation-delay:0.05s}
.kpi-card:nth-child(2){animation-delay:0.12s}
.kpi-card:nth-child(3){animation-delay:0.19s}
.kpi-card:nth-child(4){animation-delay:0.26s}
.kpi-card:nth-child(5){animation-delay:0.33s}
header{animation:fadeUp 0.5s ease both}

/* Loading */
#loading{position:fixed;inset:0;background:var(--bg1);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:20px}
.spinner-ring{width:52px;height:52px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,transparent,rgba(201,168,76,0.8));animation:spin 1s linear infinite;mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0)}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .load-title{font-family:'Cormorant Garamond',serif;font-size:20px;background:linear-gradient(135deg,var(--gold),var(--silver2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;text-transform:uppercase}
#loading p{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.header-stats{display:none}.wrapper{padding:16px}}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}}

/* ══ DOCUMENT DRAWER ══ */
.doc-drawer{
  margin-top:20px;padding:0;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;overflow:hidden;
  backdrop-filter:blur(20px);
  display:none;
  animation:slideDown 0.3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.doc-drawer-header{
  padding:18px 24px;
  background:rgba(255,255,255,0.03);
  border-bottom:1px solid rgba(255,255,255,0.07);
  display:flex;align-items:center;justify-content:space-between;
  position:relative;
}
.doc-drawer-header::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.4),rgba(255,255,255,0.15),rgba(74,158,255,0.3),transparent)}
.doc-drawer-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--gold2),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.doc-drawer-sub{font-size:12px;color:var(--muted);margin-top:2px}
.doc-close-btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif}
.doc-close-btn:hover{background:rgba(248,113,113,0.1);color:#fca5a5;border-color:rgba(248,113,113,0.3)}
.doc-cards-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:20px 24px}
.doc-mini-card{border-radius:14px;padding:16px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:all 0.2s}
.doc-mini-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.14)}
.doc-mini-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--dc,rgba(255,255,255,0.1))}
.dmc-type{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;letter-spacing:1px}
.dmc-full
